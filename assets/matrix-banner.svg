<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1a0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF41;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#00FF41;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00FF41;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="350" fill="url(#bg)"/>
  
  <!-- Scanlines -->
  <g opacity="0.05">
    <rect y="0" width="900" height="1" fill="#00FF41"/>
    <rect y="4" width="900" height="1" fill="#00FF41"/>
    <rect y="8" width="900" height="1" fill="#00FF41"/>
    <rect y="12" width="900" height="1" fill="#00FF41"/>
    <rect y="16" width="900" height="1" fill="#00FF41"/>
    <rect y="20" width="900" height="1" fill="#00FF41"/>
    <rect y="24" width="900" height="1" fill="#00FF41"/>
    <rect y="28" width="900" height="1" fill="#00FF41"/>
    <rect y="32" width="900" height="1" fill="#00FF41"/>
    <rect y="36" width="900" height="1" fill="#00FF41"/>
  </g>
  
  <!-- Matrix rain columns (left side) -->
  <g font-family="monospace" font-size="14" fill="#00FF41" opacity="0.15">
    <text x="30" y="30">0</text><text x="30" y="50">1</text><text x="30" y="70">0</text><text x="30" y="90">1</text><text x="30" y="110">1</text><text x="30" y="130">0</text><text x="30" y="150">0</text><text x="30" y="170">1</text>
    <text x="50" y="40">1</text><text x="50" y="60">0</text><text x="50" y="80">0</text><text x="50" y="100">1</text><text x="50" y="120">0</text><text x="50" y="140">1</text><text x="50" y="160">0</text><text x="50" y="180">1</text>
    <text x="70" y="25">0</text><text x="70" y="45">0</text><text x="70" y="65">1</text><text x="70" y="85">0</text><text x="70" y="105">1</text><text x="70" y="125">1</text><text x="70" y="145">0</text><text x="70" y="165">1</text>
    <text x="90" y="35">1</text><text x="90" y="55">1</text><text x="90" y="75">0</text><text x="90" y="95">0</text><text x="90" y="115">1</text><text x="90" y="135">0</text><text x="90" y="155">1</text><text x="90" y="175">0</text>
    <text x="110" y="45">0</text><text x="110" y="65">1</text><text x="110" y="85">1</text><text x="110" y="105">0</text><text x="110" y="125">1</text><text x="110" y="145">0</text><text x="110" y="165">1</text><text x="110" y="185">0</text>
    <text x="130" y="20">1</text><text x="130" y="40">0</text><text x="130" y="60">0</text><text x="130" y="80">1</text><text x="130" y="100">0</text><text x="130" y="120">1</text><text x="130" y="140">1</text><text x="130" y="160">0</text>
    <text x="150" y="50">1</text><text x="150" y="70">0</text><text x="150" y="90">1</text><text x="150" y="110">0</text><text x="150" y="130">1</text><text x="150" y="150">0</text><text x="150" y="170">1</text><text x="150" y="190">0</text>
    <text x="170" y="30">0</text><text x="170" y="50">1</text><text x="170" y="70">0</text><text x="170" y="90">1</text><text x="170" y="110">0</text><text x="170" y="130">1</text><text x="170" y="150">0</text><text x="170" y="170">1</text>
  </g>
  
  <!-- Matrix rain columns (right side) -->
  <g font-family="monospace" font-size="14" fill="#00FF41" opacity="0.15">
    <text x="750" y="30">1</text><text x="750" y="50">0</text><text x="750" y="70">1</text><text x="750" y="90">0</text><text x="750" y="110">1</text><text x="750" y="130">0</text><text x="750" y="150">1</text><text x="750" y="170">0</text>
    <text x="770" y="40">0</text><text x="770" y="60">1</text><text x="770" y="80">0</text><text x="770" y="100">1</text><text x="770" y="120">0</text><text x="770" y="140">1</text><text x="770" y="160">0</text><text x="770" y="180">1</text>
    <text x="790" y="25">1</text><text x="790" y="45">0</text><text x="790" y="65">1</text><text x="790" y="85">0</text><text x="790" y="105">1</text><text x="790" y="125">0</text><text x="790" y="145">1</text><text x="790" y="165">0</text>
    <text x="810" y="35">0</text><text x="810" y="55">1</text><text x="810" y="75">0</text><text x="810" y="95">1</text><text x="810" y="115">0</text><text x="810" y="135">1</text><text x="810" y="155">0</text><text x="810" y="175">1</text>
    <text x="830" y="45">1</text><text x="830" y="65">0</text><text x="830" y="85">1</text><text x="830" y="105">0</text><text x="830" y="125">1</text><text x="830" y="145">0</text><text x="830" y="165">1</text><text x="830" y="185">0</text>
    <text x="850" y="20">0</text><text x="850" y="40">1</text><text x="850" y="60">0</text><text x="850" y="80">1</text><text x="850" y="100">0</text><text x="850" y="120">1</text><text x="850" y="140">0</text><text x="850" y="160">1</text>
    <text x="870" y="50">1</text><text x="870" y="70">0</text><text x="870" y="90">1</text><text x="870" y="110">0</text><text x="870" y="130">1</text><text x="870" y="150">0</text><text x="870" y="170">1</text><text x="870" y="190">0</text>
  </g>
  
  <!-- Bright matrix rain drops -->
  <g font-family="monospace" font-size="16" fill="#00FF41" opacity="0.4" filter="url(#glow)">
    <text x="40" y="60">1</text>
    <text x="60" y="90">0</text>
    <text x="80" y="50">1</text>
    <text x="120" y="80">0</text>
    <text x="140" y="110">1</text>
    <text x="160" y="70">0</text>
    <text x="760" y="60">0</text>
    <text x="780" y="90">1</text>
    <text x="800" y="50">0</text>
    <text x="820" y="80">1</text>
    <text x="840" y="110">0</text>
    <text x="860" y="70">1</text>
  </g>
  
  <!-- Border glow -->
  <rect x="2" y="2" width="896" height="346" rx="8" fill="none" stroke="#00FF41" stroke-width="1" opacity="0.2"/>
  
  <!-- Title -->
  <text x="450" y="130" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00FF41" text-anchor="middle" filter="url(#glow-strong)">HACKER RANK</text>
  
  <!-- Subtitle -->
  <text x="450" y="185" font-family="'Courier New', monospace" font-size="38" font-weight="bold" fill="#00cc33" text-anchor="middle" filter="url(#glow)">DUMPER</text>
  
  <!-- Decorative line -->
  <line x1="200" y1="210" x2="700" y2="210" stroke="#00FF41" stroke-width="1" opacity="0.3"/>
  
  <!-- Stats -->
  <text x="450" y="245" font-family="'Courier New', monospace" font-size="18" fill="#00cc33" text-anchor="middle" opacity="0.9">25,909 QUESTIONS</text>
  <text x="450" y="275" font-family="'Courier New', monospace" font-size="16" fill="#00aa33" text-anchor="middle" opacity="0.7">13 DOMAINS - ALL DIFFICULTIES - CLEAN MARKDOWN</text>
  
  <!-- Bottom decorative dots -->
  <g fill="#00FF41" opacity="0.5">
    <circle cx="400" cy="310" r="2"/>
    <circle cx="420" cy="310" r="2"/>
    <circle cx="440" cy="310" r="2"/>
    <circle cx="460" cy="310" r="2"/>
    <circle cx="480" cy="310" r="2"/>
    <circle cx="500" cy="310" r="2"/>
  </g>
  
  <!-- Blinking cursor -->
  <rect x="440" y="320" width="10" height="16" fill="#00FF41" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
